[tool.poetry]
name = "jarvis"
version = "0.1.0"
description = "Local AI assistant"
authors = ["Dev <dev@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
faster-whisper = "^1.2.1"
sounddevice = "^0.5.5"
python-dotenv = "^1.2.2"
requests = "^2.34.2"
rich = "^14.0.0"
pydantic = ">=2.11.9,<2.13"
send2trash = "^2.1.0"
watchdog = "^6.0.0"
piper-tts = "^1.7.0"
nest-asyncio = "^1.6.0"
kokoro-onnx = "^0.6.1"
onnxruntime = "^1.29.0"
soundfile = "^0.14.0"
torch = "^2.13.0"
pyyaml = "^6.0.3"
crewai = "^1.15.17"
crewai-tools = "^1.15.17"
langchain-community = "^0.4.2"
langchain-ollama = "^1.1.0"
openinference-instrumentation-crewai = "^1.1.12"
openinference-instrumentation-langchain = "^0.1.70"
opentelemetry-api = "~1.42.0"
opentelemetry-sdk = "~1.42.0"
opentelemetry-exporter-otlp = "~1.42.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
black = "^26.5.1"
ruff = "^0.16.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
pythonVersion = "3.11"

